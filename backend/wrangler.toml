#:schema node_modules/wrangler/config-schema.json
name = "homecoming-backend"
main = "src/worker.ts"
compatibility_date = "2024-03-01"

[vars]
# 重複予約の設定: 'A' (重複禁止), 'B' (警告して続行可能), 'C' (重複許可)
DUPLICATE_RESERVATION_MODE = "C"
# イベント基本情報
EVENT_DATE = "2026年10月31日（土） 13:30開場／14:00開演"
EVENT_LOCATION = "大阪産業大学 本館1階 多目的ホール"
EVENT_RESERVATION_END = "2026-10-23T23:59:59+09:00"

# 5分ごとに送信対象を確認。1回40通まで処理し、無料枠とWorkerの外部通信数を抑える。
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "homecoming_db"
database_id = "4f5c6806-eee6-4571-9f76-5e46781080aa"
