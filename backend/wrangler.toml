#:schema node_modules/wrangler/config-schema.json
name = "homecoming-backend"
main = "src/index.ts"
compatibility_date = "2024-03-01"

[vars]
# 重複予約の設定: 'A' (重複禁止), 'B' (警告して続行可能), 'C' (重複許可)
DUPLICATE_RESERVATION_MODE = "A"
# イベント基本情報 (未確定項目)
EVENT_DATE = "2026年10月25日(日) 13:30開場 / 14:00開演"
EVENT_LOCATION = "大阪産業大学附属高等学校 講堂"
EVENT_RESERVATION_END = "2026-10-23T23:59:59+09:00"

[[d1_databases]]
binding = "DB"
database_name = "homecoming_db"
database_id = "local-db-id"
